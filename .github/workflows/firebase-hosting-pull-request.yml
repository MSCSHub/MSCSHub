# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm install -g @angular/cli@latest
      - run: ng build --configuration=mscs
      # Starting Oct 15, 2026, Firebase no longer creates a default Hosting
      # site with a new project, so the first deploy to a fresh project fails
      # with "404 Site Not Found". Create the site if it is missing; this is a
      # no-op when it already exists.
      - name: Ensure Firebase Hosting site exists
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UTMCS_1BCF2 }}
        run: |
          set -euo pipefail
          CREDS="$RUNNER_TEMP/firebase-site-account.json"
          trap 'rm -f "$CREDS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
          export GOOGLE_APPLICATION_CREDENTIALS="$CREDS"
          npx --yes firebase-tools@latest hosting:sites:get utmcs-1bcf2 --project utmcs-1bcf2 --non-interactive \
            || npx --yes firebase-tools@latest hosting:sites:create utmcs-1bcf2 --project utmcs-1bcf2 --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_UTMCS_1BCF2 }}
          projectId: utmcs-1bcf2
          target: utmscs
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
